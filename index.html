<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>


    <h1 class="text-center">CONVERTITORE DI VALUTA</h1>


    <i class="bi bi-toggle2-on text-dark" onclick="dark()" id="icons"></i>
    <div>
    <h1>Euro</h1>
    <img src="/Images/Europa.svg" class="immagine">
    <form>
        <input type="number" placeholder="inserire importo" id="valuta" oninput="conversione()">
    </form>
    </div>
    <div class="row">
        <div class="col col-md-12 col-sm-4">
            <h2>Dollaro americano</h2>
            <img src="/Images/USA.svg" class="immagine mx-auto">
            <p id="dollari">$</p>
        </div>
        <div class="col col-md-12 col-sm-4">
            <h2>Sterlina</h2>
            <img src="/Images/UK.png" class="immagine mx-auto">
            <p id="sterlina"></p>
        </div>
        <div class="col col-md-12 col-sm-4">
            <h2>Yen</h2>
            <img src="/Images/Giappone.svg" class="immagine mx-auto">
            <p id="yen">¥</p>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="/JS/script.js"></script>
</body>

</html>
